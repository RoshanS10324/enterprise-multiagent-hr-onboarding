name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[api,dev]"
      - name: Lint (undefined names, unused imports in the source folders)
        run: python -m ruff check --select F,E9 src connectors mcp policy guardrails evaluation run_api.py run_demo.py
      - name: Tests
        run: python -m pytest
      - name: Offline evaluation gate (12 scenarios, both entry points)
        run: python evaluation/run_evals.py
      - name: Demo runs
        run: python run_demo.py > /dev/null
