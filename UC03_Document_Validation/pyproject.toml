[project]
name = "dact"
version = "0.1.0"
description = "Enterprise HR Agent multi-agent HR/talent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # anthropic and google-genai were removed: UC-03 no longer calls a provider SDK. Model access goes only through the shared gateway
    # (optional `gateway` extra below, wired in integrations/gateway/).
    "azure-search-documents>=11.6",
    "azure-identity>=1.18",
    "azure-keyvault-secrets>=4.8",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "anyio>=4.0",
]
# Optional model help through the shared Enterprise HR Agent LLM gateway (integrations/gateway/). Off by default; the core never imports it. The shared
# package needs Python 3.12+, while UC-03 itself supports 3.11, hence the markers.
gateway = [
    "hr-onboarding-common; python_version >= '3.12'",
    "litellm>=1.83.0; python_version >= '3.12'",
]

# The shared package lives next to this folder. The directory name is case-sensitive on Linux and macOS: it is HR-Onboarding-Common.
[tool.uv.sources]
hr-onboarding-common = { path = "../HR-Onboarding-Common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pymupdf>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
