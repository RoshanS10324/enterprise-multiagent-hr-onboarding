[project]
name = "onboarding-task-management"
version = "0.1.0"
description = "UC-02 — Onboarding Task Management agent (A10 / O2). Phase 1 local synthetic-data prototype."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "jsonschema>=4.20",  # client configuration documents are validated against the shared JSON Schema
]

# ---------------------------------------------------------------------------
# BLOCKED — shared harness dependency.
#
# docs/pre-development-review.md §B recommends Option A: reuse
# `hr-recruitment-common` rather than duplicating ~1400 lines of harness.
# That package IS verified (structure + 13 pinned deps) but is NOT installable
# here: `uv` is missing (review C-14 / R-10 / D-4), and the reference repo is a
# SEPARATE git repository, so `{ workspace = true }` cannot apply across it.
#
# Uncomment once `uv` is installed AND decision D-3 (merge into monorepo vs.
# private package index vs. cross-filesystem path) is resolved. The path form
# below is the review's documented interim, not a production pattern (§B.1).
#
#   dependencies = ["pydantic>=2.10.0", "hr-recruitment-common"]
#
#   [tool.uv.sources]
#   hr-recruitment-common = { path = "../dact-core-functions-hr-sample-reference/hr-recruitment-common", editable = true }
# ---------------------------------------------------------------------------

[project.optional-dependencies]
# The integration layer (`onboarding_task_management.agent.sub_agent.api`).
# Optional: the core package and the agent loop run on pydantic alone.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

# The scenario runner lives at evaluation/ outside src/, so it is deliberately
# not installed with the package. Run it with: python evaluation/run_evals.py

[dependency-groups]
# Verification toolchain actually used on this branch. Declaring it documents
# the commands in README "Running the tests"; it installs nothing new and no
# rule configuration is pinned, so lint/type results are unchanged.
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_task_management"]

# The shared harness ships no py.typed marker, so mypy cannot see its types.
# Silencing that one import is narrower than --ignore-missing-imports, which
# would also hide a genuine typo in a first-party import.
[[tool.mypy.overrides]]
module = ["hr_recruitment_common.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = [".", "src"]
testpaths = ["tests"]
# tests/testcase.py keeps the Team-Lead-mandated filename and does not match
# pytest's default `test_*.py`, so it would otherwise be silently skipped.
python_files = ["test_*.py", "testcase.py"]
