name: uc01-ci

on:
  pull_request:
  push:
    branches: [shruthika]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage gate
        # Threshold lives in [tool.coverage.report] fail_under, so this
        # fails locally and in CI for the same reason.
        run: uv run pytest -q --cov --cov-report=term-missing

      - name: Verify business requirements end to end
        run: uv run python scripts/verify_requirements.py

      - name: Run UC-01 evals
        run: uv run python evaluation/run_evals.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc01-eval-results
          path: evaluation/uc01/results.json

      - name: Build Docker image
        run: docker build -t uc01-employee-record:ci .

      - name: Smoke test container /health
        run: |
          docker run -d --name uc01-smoke -p 8000:8000 -e APP_ENV=dev uc01-employee-record:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "health check OK"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "health check failed"
              docker logs uc01-smoke
              exit 1
            fi
            sleep 1
          done
          docker stop uc01-smoke
